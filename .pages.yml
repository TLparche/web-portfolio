# Pages CMS runs at https://app.pagescms.org; no editor code ships with the site.
# Connect the GitHub repository there, then select the branch containing this file.
# Saving writes a GitHub commit; saving on main starts the existing Pages build.
# Every nested content key is represented here because list saves replace arrays.
media:
  - name: artwork
    label: 이미지
    input: public/art
    output: /art
    extensions: [webp, png, jpg, jpeg, avif]
    rename: safe
  - name: documents
    label: 이력서 · 문서
    input: public/files
    output: /files
    extensions: [pdf]
    rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  identifier:
    type: string
    label: 항목 ID
    required: true
    pattern:
      regex: '^[a-z0-9][a-z0-9-]*$'
      message: 영문 소문자·숫자·하이픈으로 다른 항목과 겹치지 않게 입력하세요.
    description: 새 항목에만 고유 ID를 입력하세요. 기존 ID는 연결에 사용하므로 변경하지 마세요.
  link:
    type: object
    fields:
      - { name: label, label: 표시 이름, type: string, required: true }
      - name: url
        label: 주소
        type: string
        required: true
        pattern:
          regex: '^https://[^\s]+$'
          message: https://로 시작하는 전체 주소를 입력하세요.
  crop:
    type: object
    fields:
      - name: position
        label: 이미지 중심
        type: string
        description: "가로 세로 위치입니다. 예: 50% 0%. 현재 값 유지를 권장합니다."
      - name: scale
        label: 확대 배율
        type: number
        options: { min: 0.1, max: 6, step: any }
  artwork:
    type: object
    fields:
      - name: src
        label: 이미지
        type: image
        required: true
        options: { media: artwork }
        description: 투명 배경 PNG 또는 WebP를 권장합니다. 이미지 관리에서 올린 파일을 선택하세요.
      - name: thumbnail
        label: 작은 미리보기 이미지
        type: image
        options: { media: artwork }
        description: 원본 교체 시 함께 교체하거나 비우세요. 비우면 원본 이미지를 사용합니다.
      - { name: alt, label: 이미지 설명, type: string, required: true }
      - name: temporary
        label: 임시 이미지 표시
        type: boolean
        default: null
        description: 정식 이미지로 교체하면 끄세요.
      - { name: hero, label: 큰 이미지 위치 · 배율, component: crop }
      - { name: card, label: 카드 이미지 위치 · 배율, component: crop }
      - { name: backdrop, label: 배경 이미지 위치 · 배율, component: crop }
  detailSections:
    type: object
    list:
      collapsible: { collapsed: true, summary: '{fields.title}' }
    fields:
      - { name: title, label: 소제목, type: string, required: true }
      - { name: body, label: 본문, type: text, required: true }
  work:
    type: object
    list:
      min: 1
      collapsible: { collapsed: true, summary: '{fields.title}' }
    fields:
      - { name: id, component: identifier }
      - { name: title, label: 제목, type: string, required: true }
      - { name: description, label: 짧은 소개, type: text }
      - { name: period, label: 기간, type: string }
      - { name: role, label: 담당 역할, type: string }
      - { name: result, label: 기여 · 결과, type: text }
      - { name: meta, label: 소속 · 상태 등 보조 정보, type: string }
      - { name: tags, label: 키워드, type: string, list: true }
      - { name: detail, label: 상세 설명, type: text }
      - { name: bullets, label: 주요 내용 목록, type: string, list: true }
      - { name: detailSections, label: 상세 문단, component: detailSections }
      - name: links
        label: 관련 링크
        component: link
        list:
          collapsible: { collapsed: true, summary: '{fields.label}' }
      - { name: artwork, label: 대표 일러스트, component: artwork }
      - name: image
        label: 대체 이미지
        type: image
        options: { media: artwork }
        description: 대표 일러스트를 표시할 수 없을 때 사용합니다.
      - name: placeholder
        label: 임시 내용 표시
        type: boolean
        description: 실제 내용을 입력한 뒤 끄세요.
      - { name: label, label: 짧은 라벨, type: string }
      - { name: tag, label: 분류 라벨, type: string }
  record:
    type: object
    list:
      min: 1
      collapsible: { collapsed: true, summary: '{fields.title}' }
    fields:
      - { name: id, component: identifier }
      - { name: title, label: 제목, type: string, required: true }
      - { name: description, label: 설명, type: text }
      - { name: badge, label: 배지 · 점수, type: string }
      - { name: tag, label: 분류, type: string }
      - { name: period, label: 기간, type: string }
  recordGroups:
    type: object
    list:
      min: 1
      collapsible: { collapsed: true, summary: '{fields.title}' }
    fields:
      - { name: title, label: 그룹 이름, type: string, required: true }
      - { name: items, label: 기록, component: record }

content:
  - name: portfolio
    label: 포트폴리오 내용
    type: file
    path: content/portfolio.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - name: profile
        label: 기본 정보 · 시작 명함 · 연락처
        type: object
        description: 비워 둔 항목은 기존 플레이스홀더로 표시됩니다. 공개할 정보만 입력하세요.
        fields:
          - { name: name, label: 이름 · 닉네임, type: string }
          - { name: role, label: 직무 · 역할, type: string }
          - { name: tagline, label: 한 줄 소개, type: text }
          - { name: affiliation, label: 소속, type: string }
          - name: email
            label: 이메일
            type: string
            pattern:
              regex: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
              message: 이메일 주소를 입력하거나 비워 두세요.
          - name: cv
            label: 이력서 PDF
            type: file
            options: { media: documents }
          - name: links
            label: 공개 링크
            component: link
            list:
              collapsible: { collapsed: true, summary: '{fields.label}' }
      - name: sections
        label: 슬라이드 · 내용
        type: block
        blockKey: kind
        list:
          min: 11
          max: 11
          collapsible: { collapsed: true, summary: '{fields.title}' }
        description: 11개 항목이 5개 장으로 묶여 표시됩니다. 항목을 열어 내용을 수정하세요. 종류·ID·장면 연결은 그대로 유지하세요.
        blocks:
          - name: intro
            label: 소개
            fields:
              - &sectionId
                name: id
                label: 섹션 ID
                type: string
                readonly: true
                required: true
              - &sectionTitle { name: title, label: 메뉴 · 탭 이름, type: string, required: true }
              - &sectionDisplay { name: display, label: 큰 제목, type: text }
              - &sectionEnabled
                name: enabled
                label: 섹션 활성화
                type: boolean
                readonly: true
                description: 현재 5장 구성을 유지하는 연결 설정입니다.
              - &sectionScene { name: sceneId, label: 장면 연결, type: string, hidden: true, readonly: true }
              - &sectionFraming
                name: framing
                type: object
                hidden: true
                readonly: true
                fields:
                  - { name: side, type: string }
              - &sectionHeadline { name: headline, label: 소개 제목, type: string }
              - &sectionBody { name: body, label: 소개 본문, type: text }
              - name: facts
                label: 기본 정보 줄
                type: object
                list:
                  min: 1
                  max: 3
                  collapsible: { collapsed: true, summary: '{fields.label}' }
                fields:
                  - { name: label, label: 항목 이름, type: string, required: true }
                  - { name: value, label: 내용, type: string }
              - &emptyItems
                name: items
                component: work
                hidden: true
                readonly: true
                list: true
          - name: interests
            label: 관심분야
            fields:
              - *sectionId
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - name: artwork
                label: 섹션 기본 일러스트
                component: artwork
                description: 개별 관심분야 이미지는 아래 항목에서 수정하세요.
              - name: items
                label: 관심분야 5개
                type: object
                list:
                  min: 5
                  max: 5
                  collapsible: { collapsed: true, summary: '{fields.displayName}' }
                description: 현재 카드 구성에 맞춰 5개를 유지합니다. 첫 번째 이미지가 시작 명함에도 표시됩니다.
                fields:
                  - { name: id, component: identifier, readonly: true }
                  - { name: displayName, label: 표시 이름, type: string, required: true }
                  - { name: label, label: 카드 라벨, type: string }
                  - { name: title, label: 제목, type: string, required: true }
                  - { name: tag, label: 영문 분류, type: string }
                  - { name: description, label: 짧은 질문 · 설명, type: text }
                  - { name: summary, label: 소개 본문, type: text }
                  - { name: tags, label: 키워드, type: string, list: true }
                  - { name: why, label: 관심 이유, type: text }
                  - { name: approach, label: 접근 방법, type: text }
                  - { name: where, label: 활용 방향, type: text }
                  - { name: question, label: 연구 질문, type: text }
                  - name: accent
                    label: 포인트 색상
                    type: string
                    pattern: '^$|^#[0-9a-fA-F]{6}$'
                    description: '#e564c8처럼 6자리 색상 코드를 입력하세요.'
                  - { name: artwork, label: 관심분야 일러스트, component: artwork }
                  - name: image
                    label: 대체 이미지 경로
                    type: string
                    readonly: true
                  - { name: backgroundId, type: string, hidden: true, readonly: true }
                  - { name: detailSections, label: 추가 상세 문단, component: detailSections }
                  - { name: links, label: 관련 링크, component: link, list: true }
          - name: projects
            label: 프로젝트 · 작업 대표 화면
            fields:
              - *sectionId
              - *sectionTitle
              - &sectionGroupTitle { name: groupTitle, label: 묶음 메뉴 이름, type: string }
              - &sectionChapterOrder
                name: chapterOrder
                label: 하위 탭 연결 순서
                type: string
                list: true
                readonly: true
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - name: featuredItemIds
                label: 첫 화면 대표 작업 6개
                type: string
                list: { min: 6, max: 6, collapsible: false }
                pattern: '^[a-z0-9][a-z0-9-]*$'
                description: 프로젝트·경험·연구·활동의 실제 표시 작업 ID 중 6개를 입력하세요. 순서를 바꾸면 대표 이미지 순서도 바뀝니다. 대표 작업 삭제 전 이 목록부터 교체하세요.
              - &showcaseItems
                name: showcaseItems
                label: 실제 표시되는 작업 카드
                component: work
                description: 현재 사이트의 카드와 상세 화면에 표시되는 내용입니다. 추가·삭제·순서 변경이 가능합니다. 대표 화면에 연결한 항목은 연결을 바꾼 뒤 삭제하세요.
              - &legacyItems
                name: items
                label: 기존 원본 기록 · 현재 카드에서 사용하지 않음
                component: work
                hidden: true
                readonly: true
                list: true
          - name: experience
            label: 경험
            fields:
              - *sectionId
              - &sectionMergeInto { name: mergeInto, label: 상위 장 연결, type: string, readonly: true }
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *showcaseItems
              - *legacyItems
          - name: credentials
            label: 자격 · 어학
            fields:
              - *sectionId
              - *sectionMergeInto
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *emptyItems
              - { name: groups, label: 자격 · 어학 기록, component: recordGroups }
          - name: education
            label: 학력 · 이력 대표 화면
            fields:
              - *sectionId
              - *sectionTitle
              - *sectionGroupTitle
              - *sectionChapterOrder
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - { name: items, label: 학력 · 교육 과정, component: record }
              - name: stats
                label: 학점 · 수치 정보
                type: object
                list:
                  max: 3
                  collapsible: { collapsed: true, summary: '{fields.label}' }
                fields:
                  - { name: label, label: 항목 이름, type: string, required: true }
                  - { name: value, label: 값, type: string }
                  - { name: suffix, label: 단위 · 보조 설명, type: string }
          - name: awards
            label: 수상 · 성취
            fields:
              - *sectionId
              - *sectionMergeInto
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *emptyItems
              - { name: groups, label: 수상 · 성취 기록, component: recordGroups }
          - name: publications
            label: 연구
            fields:
              - *sectionId
              - *sectionMergeInto
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *showcaseItems
              - *legacyItems
          - name: skills
            label: 스킬 · 도구
            fields:
              - *sectionId
              - *sectionMergeInto
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - name: items
                label: 분야별 스킬
                type: object
                list:
                  min: 1
                  collapsible: { collapsed: true, summary: '{fields.title}' }
                fields:
                  - { name: id, component: identifier }
                  - { name: label, label: 짧은 분류, type: string }
                  - { name: title, label: 분야 이름, type: string, required: true }
                  - { name: description, label: 사용 도구 · 적용 경험, type: text }
                  - name: level
                    label: 숙련도 수치
                    type: number
                    options: { min: 0, max: 100 }
                    description: 직접 정한 수치가 없으면 비워 두세요.
                  - name: accent
                    label: 포인트 색상
                    type: string
                    pattern: '^$|^#[0-9a-fA-F]{6}$'
                  - { name: image, label: 기존 이미지 경로, type: string, readonly: true }
              - { name: toolbox, label: 도구 목록, type: string, list: true }
          - name: activities
            label: 활동
            fields:
              - *sectionId
              - *sectionMergeInto
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *showcaseItems
              - *legacyItems
          - name: contact
            label: 연락처 문구
            fields:
              - *sectionId
              - *sectionTitle
              - *sectionDisplay
              - *sectionEnabled
              - *sectionScene
              - *sectionFraming
              - *sectionHeadline
              - *sectionBody
              - *emptyItems
